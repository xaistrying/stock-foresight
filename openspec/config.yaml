schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  Product: web app predicting short-term price movement for Vietnamese stocks.
  Dashboard = chart panel + ticker-loading panel (vnstock -> SQLite) + AI insight
  panel (Confidence, Market Sentiment, Advice). Model v1 is a single XGBoost
  regressor. SageMaker and real news-based sentiment are future milestones
  (M7, M8) — not implemented, do not assume they exist.

  Tech stack: FastAPI (Python, pip + requirements.txt — no poetry/uv without
  asking first), Vite + React (npm), SQLite, XGBoost. Data source is the
  `vnstock` package — use the project's vnstock skill, don't hand-roll calls
  it already wraps. UI generation uses the Hallmark design skill, which
  auto-attaches when asked to build UI; if it asks for audience/tone, answer
  consistently: Audience = individual Vietnamese retail investors, Tone =
  professional, data-dense, trustworthy — not playful, not marketing-style.

  Common commands:
    Backend setup: python -m venv .venv && source .venv/bin/activate
    Backend install: pip install -r backend/requirements.txt
    Backend run: uvicorn app.main:app --reload --app-dir backend
    Backend tests: pytest backend/tests
    Frontend: cd frontend && npm install && npm run dev
    Frontend tests: cd frontend && npm run test

  Non-negotiable domain rules — restate the rule number in any spec/design that
  touches one of these; if a task seems to require changing one, stop and ask
  first rather than silently changing it:
    1. Prediction target: target_t = ln(close[t+5] / close[t]) — log return,
       5 TRADING SESSIONS ahead, not calendar days.
    2. Never show raw log return in the UI — convert to a simple percentage
       for display.
    3. Advice thresholds are volatility-relative: 0.5 x rolling_std(returns,
       60 sessions), not a fixed number. The 0.5 coefficient is provisional
       and may change after backtesting (M3) — the volatility-relative
       *design* is not provisional.
    4. Confidence score (v1) = backtested hit-rate over the ticker's most
       recent ~60 predictions. Not a statistical prediction interval (that's
       a future quantile-regression upgrade, out of v1 scope).
    5. "Market Sentiment" is a technical proxy (RSI, MACD, Ichimoku position),
       not real news/NLP sentiment. Must be labeled as such in the UI.
    6. Never frame output as investment advice. Use "technical observation"
       framing and show the disclaimer from docs/DISCLAIMER.md anywhere
       Advice, Confidence, or Sentiment is displayed.

  Repository structure: backend/app/{api,core,db,services,ml}/,
  backend/data/app.db, frontend/src/{components,pages,api,hooks}/,
  docs/{MODEL_CARD.md, DATA_DICTIONARY.md, DISCLAIMER.md}, scripts/, openspec/.
  docs/DATA_DICTIONARY.md doesn't exist yet — created in M1.
  docs/DISCLAIMER.md doesn't exist yet — created in M6, when Advice/Confidence/
  Sentiment are first displayed. Not M1 — there's nothing to disclaim before
  M6 produces UI output.
  Do not assume a SQLite schema; it isn't finalized until M1.

  Before proposing, check docs/KNOWN_ISSUES.md (confirmed issues not yet
  scheduled into a milestone) and any docs/DISCUSSION_*.md (open design
  questions raised during manual verification of a past change) for items
  relevant to the change at hand — fold them in or note them as explicitly
  deferred, rather than silently re-discovering the same gap later. This
  list of docs may grow; treat any new DISCUSSION_*.md or backlog file the
  same way without needing this line updated.

  Milestone status:
    [x] M0 - Target variable decided
    [x] M1 - Data ingestion (ticker -> vnstock -> SQLite)
    [x] M2 - Feature engineering (Ichimoku, RSI, MACD, Bollinger, ATR, OBV)
    [x] M3 - XGBoost training pipeline + backtest
    [x] M4 - FastAPI prediction endpoints
    [x] M5 - Vite/React dashboard + ticker panel (shipped 2026-08-12 via the
        vite-react-dashboard-ticker-panel change; absorbed M6's AI insight
        panel scope into this same change rather than leaving it a stub —
        see docs/M5_DASHBOARD_EXPLORE_NOTES.md for why). Manual-refresh
        follow-up also shipped same day (ticker-manual-refresh change).
    [x] M6 - AI insight panel — delivered as part of M5 above, not as a
        separate milestone. Confidence/Sentiment/Advice/disclaimer are
        real (rules 3-6 in effect), not the stubbed contract below.
    [x] Post-M6 hardening - HOSE universe ingestion (shipped 2026-09-07 via
        the hose-universe-ingestion change): point-in-time universe
        construction (405 listed + 194 delisted HOSE stocks ingested, no
        survivorship bias), an OHLCV quality gate (price-limit violations,
        missed-split detection, stale-close/liquidity filtering), and
        GET /tickers now derived from the universe instead of hard-coded to
        TRAINING_TICKERS. 208 of 599 ingested symbols currently pass the
        modelling-universe filters. See
        openspec/changes/archive/2026-09-07-hose-universe-ingestion/ and
        docs/DISCUSSION_model_direction.md for why this was undertaken.

  Current focus: no active milestone. Priority is hardening and polishing
  what M0-M6 already shipped, not starting M7/M8 — see Known gaps below and
  docs/KNOWN_ISSUES.md / docs/DISCUSSION_*.md for specifics. Treat any new
  proposal through this lens first: does it improve/fix the existing
  dashboard, model, or pipeline, before considering new-milestone scope.

  The single most consequential open item: the served model
  (backend/data/models/pooled_xgb_model.json) is still the original M3
  artifact — trained on data through 2026-07-30, on only the original 9
  TRAINING_TICKERS — and was never retrained after the universe expansion
  above. Its own pooled out-of-fold hit-rate (47.8%) is documented in
  docs/MODEL_CARD.md as statistically indistinguishable from a coin flip.
  A live consequence of this gap, measured 2026-09-11: 198 of the 208
  tickers in the modelling universe show Confidence as N/A, because
  compute_rolling_hit_rate has no backtest history for anything outside
  the original 9. See docs/DISCUSSION_model_direction.md in full — it
  found the flat-prediction result is not a tuning problem (fixing the
  model's non-stationary features does not rescue directional accuracy at
  any horizon from 5 to 252 sessions), that volatility forecasting works
  well on the same data (corr ~0.48, stable across folds and tickers), and
  that cross-sectional momentum — the one directional effect that
  survived testing — specifically needed a universe larger than 9-15
  tickers to be exploitable, which now exists and is as yet untested. Any
  of that doc's five options (do nothing / fix features only / pivot to
  volatility / add portfolio risk via holdings / pursue cross-sectional
  signal) requires deciding Rule 4's definition, since Confidence as
  currently defined cannot survive a volatility pivot unchanged. Treat
  this as the natural next explore/propose session, not a bug to patch.

  Known gaps in the shipped M5/M6 surface (each already has a doc, not
  freshly discovered — fold into a proposal or explicitly defer again,
  don't rediscover):
    - Fresh/Stale is internal-consistency-only, never calendar-aware — a
      ticker can sit unloaded for weeks and still show Fresh. Reframed by
      measurement (2026-08-28): the dot is provably constant, not just
      rarely Stale — every loaded ticker's prediction and stored history
      move in lockstep by construction, so Stale is unreachable. Open
      question is now "repoint it at a reference that varies (e.g. the
      max session date across all loaded tickers), or remove it" rather
      than "should a second signal be added." See
      docs/DISCUSSION_calendar_staleness.md (open, undecided).
    - No mechanism logs live predictions or scores them against realized
      outcomes later — Confidence (rule 4) is backtest-only, live drift is
      invisible. See docs/DISCUSSION_prediction_outcome_tracking.md (open,
      undecided; flagged as a likely prerequisite for real continuous
      retraining, whenever that's picked up).

  Future, deliberately not scoped yet (vague on purpose — do not start
  designing against these without a dedicated explore/propose session
  first; no interface contract below is binding until that happens):
    [ ] M7 - SageMaker integration - idea only, not discussed, not started.
        No target service (training vs. hosted inference vs. both),
        no design, no contract decided.
    [ ] M8 - Real news-based sentiment - idea only, not discussed, not
        started. Would replace/augment the technical-proxy Sentiment
        (rule 5) with real NLP sentiment; needs its own explore session
        given rule 5's current "must be labeled as a technical proxy,
        not real sentiment" constraint.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  proposal:
    - If the change touches any non-negotiable domain rule (1-6 above),
      name the rule number explicitly and state whether it's honored
      unchanged or requires sign-off to change.
  design:
    - Any threshold, score, or label definition must cite which domain rule
      it implements, or note that it's new (not yet covered by this file).
  tasks:
    - Do not include tasks that hand-roll vnstock API calls already wrapped
      by the project's vnstock skill.
    - Any task that renders Confidence, Sentiment, or Advice in the UI must
      include (a) labeling Sentiment explicitly as a technical proxy, not
      real sentiment (rule 5), and (b) displaying the investment-advice
      disclaimer (rule 6).
