<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Foresight</title>
    <!-- Applies a stored theme choice before first paint, so a dark-theme user never sees a light
         flash. Storage can be blocked: any failure leaves the page following the operating
         system. Keep the key equal to THEME_STORAGE_KEY in src/hooks/useTheme.js. -->
    <script>
      try {
        var theme = localStorage.getItem('stock-foresight-theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme)
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
